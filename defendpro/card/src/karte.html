<!DOCTYPE html>
<html lang="de-AT">
<head>
<meta charset="utf-8">
<title>Defend Pro Visitenkarte</title>
<style>
/* ============================================================
   DEFEND PRO . Visitenkarte
   Endformat 85 x 55 mm, Beschnitt 3 mm ringsum, Seite 91 x 61 mm.
   Sicherheitsabstand 4 mm innerhalb der Schnittkante, also 7 mm
   ab Seitenrand. Nichts Wichtiges liegt darin naeher am Rand.
   ============================================================ */

/* Inter, eingebettet. SIL Open Font License 1.1.
   Der Druck braucht die Schrift in der Datei, ein Systemaufruf
   wuerde beim Belichter eine andere Schrift einsetzen. */
@font-face{font-family:Inter;font-style:normal;font-weight:400;font-display:block;src:url({{FONT_400}}) format("woff2")}
@font-face{font-family:Inter;font-style:normal;font-weight:600;font-display:block;src:url({{FONT_600}}) format("woff2")}
@font-face{font-family:Inter;font-style:normal;font-weight:700;font-display:block;src:url({{FONT_700}}) format("woff2")}
@font-face{font-family:Inter;font-style:normal;font-weight:800;font-display:block;src:url({{FONT_800}}) format("woff2")}

:root{
  --navy:#172A4E;
  --bone:#FAF7F2;
  --gold:#B8A05C;
  --gold-d:#7D692E;
  --ink-2:#4A5872;
  --line:rgba(23,42,78,.16);

  --bleed:3mm;
  --safe:7mm;       /* Beschnitt plus 4 mm Sicherheitsabstand */
}

@page{
  size:91mm 61mm;
  margin:0;
}

*{box-sizing:border-box;margin:0;padding:0}

html,body{
  font-family:Inter,sans-serif;
  -webkit-font-smoothing:antialiased;
}

body{
  /* Hintergrundfarben muessen mitdrucken. */
  -webkit-print-color-adjust:exact;
          print-color-adjust:exact;
}

.side{
  position:relative;
  width:91mm;
  height:61mm;
  overflow:hidden;
  break-after:page;
  page-break-after:always;
}
.side:last-child{break-after:auto;page-break-after:auto}

.front{background:var(--navy)}
.back{background:var(--bone)}

/* ---------- Vorderseite ---------- */

.watermark{
  position:absolute;
  top:50%;
  right:-9mm;
  transform:translateY(-50%);
  height:48mm;
  color:var(--gold);
  opacity:.13;
}
.watermark svg{height:100%;width:auto;display:block}

.wordmark{
  position:absolute;
  left:var(--safe);
  top:20mm;
  width:35mm;
  color:#FFFFFF;
}
.wordmark svg{width:100%;height:auto;display:block}

.claim{
  position:absolute;
  left:var(--safe);
  bottom:9mm;
  color:var(--gold);
}
.claim .rule{
  width:13mm;
  height:.35mm;
  background:currentColor;
  margin-bottom:2.4mm;
}
.claim span{
  display:block;
  font-size:5.9pt;
  font-weight:700;
  letter-spacing:.18em;
  text-transform:uppercase;
  line-height:1.2;
}

/* ---------- Rueckseite ---------- */

.emblem{
  position:absolute;
  right:var(--safe);
  bottom:var(--safe);
  height:9.5mm;
  color:var(--gold-d);
}
.emblem svg{height:100%;width:auto;display:block}

.name{
  position:absolute;
  left:var(--safe);
  top:14mm;
  color:var(--navy);
  font-size:13pt;
  font-weight:800;
  letter-spacing:-.025em;
  line-height:1;
}

.role{
  position:absolute;
  left:var(--safe);
  top:21mm;
  color:var(--gold-d);
  font-size:6.8pt;
  font-weight:700;
  letter-spacing:.11em;
  text-transform:uppercase;
  line-height:1.35;
}

.divider{
  position:absolute;
  left:var(--safe);
  right:var(--safe);
  top:28.5mm;
  height:.25mm;
  background:var(--line);
}

.contact{
  position:absolute;
  left:var(--safe);
  top:33mm;
  color:var(--ink-2);
  font-size:7.4pt;
  font-weight:400;
  line-height:1.62;
}
.contact b{
  color:var(--navy);
  font-weight:600;
}
</style>
</head>
<body>

<!-- ============ VORDERSEITE ============ -->
<section class="side front">
  <div class="watermark">{{EMBLEM_SVG}}</div>
  <div class="wordmark">{{LOGO_SVG}}</div>
  <div class="claim">
    <div class="rule"></div>
    <span>Prävention · Deeskalation · Eigensicherung</span>
  </div>
</section>

<!-- ============ RÜCKSEITE ============ -->
<section class="side back">
  <div class="emblem">{{EMBLEM_SVG}}</div>

  <div class="name">Matthias Gastgeb</div>
  <div class="role">Staatlich geprüfter Diplomtrainer</div>

  <div class="divider"></div>

  <div class="contact">
    <!--
      Telefonnummer und Anschrift liegen nicht vor und stehen deshalb
      nicht auf der Karte. Zum Ergaenzen eine Zeile hier einfuegen:
          <b>+43 000 0000000</b><br>
      und in karte.html oben .contact top auf 31mm setzen, damit
      vier Zeilen innerhalb des Sicherheitsabstands bleiben.
    -->
    <b>matthias.gastgeb@defendpro.at</b><br>
    defendpro.at<br>
    Wien, Österreich
  </div>
</section>

</body>
</html>
